name: Set up ShellCheck
description: Install a pinned ShellCheck release, verified against a pinned checksum.

# ShellCheck releases publish no checksum files, so the archive's sha256 is pinned here and
# must change with the version.
inputs:
  version:
    description: ShellCheck release to install.
    default: '0.11.0'
  sha256:
    description: sha256 of the release's linux.x86_64.tar.xz archive.
    default: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'

runs:
  using: composite
  steps:
    - name: Install ShellCheck
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.version }}
        SHELLCHECK_SHA256: ${{ inputs.sha256 }}
      run: |
        cd "$RUNNER_TEMP"
        archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        curl -sSfLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$archive"
        echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check -
        tar -xJf "$archive" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
