name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  # main -> prod, everything else -> dev. Baked into absolute URLs at build time (paths.origin in vite.config.ts).
  SITE_ORIGIN: ${{ github.ref_name == 'main' && 'https://jmuzina.io' || 'https://dev.jmuzina.io' }}

jobs:
  build:
    outputs:
      STORE_PATH: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
      PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.VERSION }}
    strategy:
      matrix:
        node: [24, 26]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          version: 12.4.1
          install: false # We'll try fetching from cache first.

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # uses cache if cache hit.

      # The visual job's image tag must match the installed Playwright.
      - name: Get Playwright version
        id: playwright
        run: echo "VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check
        run: pnpm run check

      # Not the vale-action: by default it only annotates added lines and never fails the build.
      - name: Set up Vale
        uses: ./.github/actions/setup-vale

      - name: Set up ShellCheck
        uses: ./.github/actions/setup-shellcheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Lint build output
        run: pnpm run lint:build

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v7
        with:
          name: workspace-node-v${{ matrix.node }}
          path: .

      - name: Upload site artifact
        if: matrix.node == 26
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build

  test:
    needs: build
    strategy:
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v7
        with:
          name: workspace-node-v${{ matrix.node }}
          path: .

      - name: Cache pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ needs.build.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          version: 12.4.1
          install: false # (its in the cache)

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: pnpm run test

      - name: Run e2e tests
        run: pnpm run test:e2e

  visual:
    needs: build
    runs-on: ubuntu-24.04
    # The same image scripts/e2e-visual.sh makes baselines in. The bare runner's fonts would
    # never match them.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.PLAYWRIGHT_VERSION }}-noble
      options: --user 1001
    steps:
      - name: Download workspace artifact
        uses: actions/download-artifact@v7
        with:
          name: workspace-node-v26
          path: .

      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          version: 12.4.1
          install: false

      - name: Run visual tests
        id: visual
        run: pnpm exec playwright test --config playwright.visual.config.ts

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: playwright-report

      # Gives a change that moves pixels (a new post, say) its baselines without Docker on the
      # author's machine, or an agent leaving its sandbox to reach Docker. Runs after the report
      # upload because it overwrites playwright-report.
      - name: Update visual baselines
        if: failure() && steps.visual.outcome == 'failure'
        run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots

      - name: Upload visual baselines
        if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    needs: [build, test, visual]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # main -> prod (jmuzina.io), dev -> dev (dev.jmuzina.io)
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ env.SITE_ORIGIN }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site
          path: build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Check for changed deployment
        id: changes
        run: |
          changes=$(rsync -azcnO --delete --itemize-changes build/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:")
          if [ -z "$changes" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Skipping deployment."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$changes"
          fi

      - name: Deploy
        if: steps.changes.outputs.changed == 'true'
        run: |
          rsync -azcO --delete build/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:"
