name: jmuzina.io

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    steps:
      # todo likely these steps can be extracted into a composite action
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          version: 12.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # uses cache if cache hit.

      - name: Check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://${{ secrets.AWS_S3_BUCKET_NAME }} --acl public-read --delete

      - name: Invalidate CloudFront Distribution
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "${{ inputs.cloudfront_invalidation }}"
