StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Site

# Plain text, so comments (including Svelte's HTML comments, which Vale's HTML parser drops)
# and UI strings are checked too.
[formats]
svelte = txt
ts = txt
js = txt
css = txt

[*.{md,svelte,ts,js,css}]
BasedOnStyles = Site

# Spell-check prose only: in code, identifiers like `navRoutes` would drown out real typos.
[*.md]
Vale.Spelling = YES
